spring.application.name=shiftapp

# ===================================================================
# SERVER
# ===================================================================
# Railway (and most PaaS) inject the port to bind to via $PORT.
# Falls back to 8080 for local development.
server.port=${PORT:8080}

# ===================================================================
# DATABASE CONFIGURATION (PostgreSQL)
# ===================================================================
# All values are environment-overridable so the same build runs against:
#   - local Postgres / Docker (defaults below)
#   - Neon (managed Postgres) when deployed on Railway
#
# On Railway/Neon, set these environment variables on the service:
#   SPRING_DATASOURCE_URL      e.g. jdbc:postgresql://ep-xxx-pooler.us-east-2.aws.neon.tech/shiftapp_dev?sslmode=require
#   SPRING_DATASOURCE_USERNAME e.g. shiftapp_user
#   SPRING_DATASOURCE_PASSWORD e.g. <neon-password>
# (Spring Boot maps these env vars onto the spring.datasource.* properties below.)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shiftapp_dev}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:shiftapp_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:shiftapp_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# JPA / HIBERNATE CONFIGURATION
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Local default keeps the fast "rebuild the schema each run" workflow.
# On a hosted DB (Neon) override with SPRING_JPA_HIBERNATE_DDL_AUTO=update
# so deployments don't wipe data on every restart.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:create-drop}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.open-in-view=false

# ===================================================================
# JWT CONFIGURATION
# ===================================================================
# Secret key for signing JWT tokens (MUST be at least 256 bits / 32 characters)
# In production, use environment variables instead of hardcoding!
# On Railway, set JWT_SECRET to a strong random value (>= 32 chars).
jwt.secret=${JWT_SECRET:your-super-secret-key-that-should-be-at-least-256-bits-long-for-security}

# Access token TTL (ms). Short-lived, kept in front-end memory.
# 15 minutes
jwt.access.expiration=900000

# Refresh token TTL (ms). Long-lived, transported via HttpOnly cookie.
# 7 days
jwt.refresh.expiration=604800000

# Legacy alias retained for backwards compatibility (= access expiration).
jwt.expiration=900000

# ===================================================================
# REFRESH-TOKEN COOKIE CONFIGURATION
# ===================================================================
# Cookie name written by /api/auth/login, /register, /refresh and
# cleared by /api/auth/logout.
app.auth.refresh-cookie.name=refresh_token

# Limits the cookie to auth endpoints only – it never leaks to /api/shifts etc.
app.auth.refresh-cookie.path=/api/auth

# Set to true behind HTTPS (production). Keep false for local http://localhost.
# On Railway (HTTPS), set APP_AUTH_REFRESH_COOKIE_SECURE=true.
app.auth.refresh-cookie.secure=${APP_AUTH_REFRESH_COOKIE_SECURE:false}

# SameSite policy: Lax | Strict | None. Use None only with Secure=true (cross-site SPA).
app.auth.refresh-cookie.same-site=Lax

# ===================================================================
# DATA SEEDING
# ===================================================================
# When true, com.example.shiftapp.config.DataSeeder will populate the
# database on startup IF the users table is empty. Safe to leave on:
# it is a no-op once data already exists.
app.seed.enabled=true
app.seed.default-password=pass1234

# ===================================================================
# LOGGING
# ===================================================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
